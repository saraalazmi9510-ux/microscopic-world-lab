<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة إلى العالم المجهري</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#071522;color:#eefcff}header{padding:20px;text-align:center;background:linear-gradient(135deg,#0c3140,#102345)}h1{margin:5px}.app{max-width:1200px;margin:auto;padding:15px;display:grid;grid-template-columns:190px 1fr 235px;gap:14px}.card{background:#0c2030;border:1px solid #24475a;border-radius:18px;padding:14px}.steps div{padding:10px;margin:7px 0;border-radius:12px;background:#102b3a}.steps .on{outline:2px solid #56d6c9}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button,select{font:inherit;color:#fff;background:#14374a;border:1px solid #376277;border-radius:11px;padding:10px;cursor:pointer}.active{background:#19766f!important}.view{min-height:470px;background:#03080d;border-radius:18px;display:grid;place-items:center;overflow:hidden}.circle{width:min(430px,78vw);aspect-ratio:1;border:12px solid #294052;border-radius:50%;overflow:hidden;position:relative;background:#e8e1cf}.circle svg{width:100%;height:100%;transition:filter .08s linear}.off{position:absolute;inset:0;background:#020609;display:grid;place-items:center;z-index:10}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.controls label{background:#102b3a;border-radius:12px;padding:10px}.controls input,.controls select{width:100%;margin-top:7px}.note{color:#c8e1e5;line-height:1.65}.tag{display:inline-block;padding:4px 7px;background:#174355;border-radius:8px;margin:3px;font-size:12px}.legend{margin-top:8px;font-size:12px;color:#d5eef2}.quiz button{width:100%;margin:4px 0}.good{color:#77f0a9}.bad{color:#ff9b9b}@media(max-width:800px){.app{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.steps{display:flex;overflow:auto}.steps div{min-width:140px}}</style></head><body><header>🔬 مختبر الأحياء الافتراضي<h1>رحلة إلى العالم المجهري</h1><div>حرّك التركيز والإضاءة وشاهد التغيّر مباشرة داخل العدسة</div></header><div class="app"><aside class="card"><b>مراحل الرحلة</b><div class="steps" id="steps"></div></aside><main><section class="card"><div class="toolbar"><button id="power">⏻ تشغيل المجهر</button><button class="sample" data-s="b">🦠 البكتيريا</button><button class="sample" data-s="v">🧬 الفيروسات</button><button id="reset">↻ إعادة</button></div><div class="view"><div class="circle" id="field"><div class="off" id="off">المجهر مطفأ</div><svg id="pic" viewBox="0 0 500 500"></svg></div></div><div class="controls"><label>🔎 التكبير<select id="mag"><option value="100">100×</option><option value="400">400×</option><option value="1000">1000×</option></select></label><label>🎯 التركيز<input id="focus" type="range" min="0" max="100" value="25"><small id="ft">غير واضح — 25%</small></label><label>💡 الإضاءة<input id="light" type="range" min="10" max="100" value="65"><small id="lt">65%</small></label></div><div class="legend" id="legend">اختر عينة لبدء الفحص.</div></section></main><aside><div class="card"><b>🧪 ما الذي أراه؟</b><p class="note" id="inst">شغّل المجهر أولًا.</p></div><div class="card" style="margin-top:12px"><b>📋 سجل الملاحظة</b><p class="note" id="obs">لم تُفحص عينة بعد.</p></div><div class="card quiz" style="margin-top:12px"><b>🏆 تحدي الباحث</b><p>أي عينة تحتاج مجهرًا إلكترونيًا لرؤية بنيتها الدقيقة؟</p><button data-a="0">البكتيريا</button><button data-a="1">الفيروسات</button><div id="feed"></div></div></aside></div><script>const steps=['تشغيل المجهر','اختيار العينة','زيادة التكبير','ضبط التركيز','اكتشاف التراكيب'];let on=false,s='',stage=0;const pic=document.querySelector('#pic'),field=document.querySelector('#field'),inst=document.querySelector('#inst'),obs=document.querySelector('#obs'),legend=document.querySelector('#legend'),stepsEl=document.querySelector('#steps'),focusEl=document.querySelector('#focus'),lightEl=document.querySelector('#light'),magEl=document.querySelector('#mag'),ft=document.querySelector('#ft'),lt=document.querySelector('#lt'),off=document.querySelector('#off');function drawSteps(){stepsEl.innerHTML=steps.map((x,i)=>`<div class="${i===stage?'on':''}">${i+1}. ${x}</div>`).join('')}drawSteps();function bacteria(m){if(m==100)return `<rect width="500" height="500" fill="#eadcc7"/><g fill="#80568d">${[[80,90],[180,65],[330,110],[115,230],[270,250],[380,300],[190,390],[75,365]].map((p,i)=>`<rect x="${p[0]}" y="${p[1]}" width="70" height="25" rx="13" transform="rotate(${i*23} ${p[0]} ${p[1]})"/>`).join('')}</g>`;if(m==400)return `<rect width="500" height="500" fill="#efe1c8"/><g stroke="#482957" stroke-width="7" fill="#c47bb4"><rect x="80" y="90" width="160" height="65" rx="33"/><rect x="260" y="210" width="165" height="65" rx="33" transform="rotate(-25 340 240)"/><rect x="85" y="320" width="170" height="65" rx="33" transform="rotate(20 170 350)"/></g><g fill="#4d285c">${[[115,120],[145,128],[185,115],[300,250],[340,230],[375,240],[125,350],[170,345],[210,365]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5"/>`).join('')}</g>`;return `<rect width="500" height="500" fill="#f2e6ce"/><g transform="translate(50 115)"><rect x="30" y="50" width="340" height="170" rx="85" fill="#673e75"/><rect x="42" y="62" width="316" height="146" rx="73" fill="#d68fbd" stroke="#f1c7e1" stroke-width="9"/><rect x="58" y="77" width="284" height="116" rx="58" fill="#edaed2"/><path d="M95 145 C135 90 185 180 225 120 S300 145 320 100" fill="none" stroke="#63366d" stroke-width="10"/><g fill="#6d3e72">${Array.from({length:28},(_,i)=>`<circle cx="${85+(i*37)%245}" cy="${92+(i*29)%82}" r="4"/>`).join('')}</g><path d="M370 135 C430 80 430 220 470 150" fill="none" stroke="#7b4b87" stroke-width="7"/></g>`}function virus(m){if(m==100)return `<rect width="500" height="500" fill="#242a31"/><text x="250" y="225" text-anchor="middle" fill="#eef" font-size="23">الفيروسات أصغر من قدرة المجهر الضوئي</text><text x="250" y="275" text-anchor="middle" fill="#6ee0d5" font-size="17">ارفع التكبير لمحاكاة المجهر الإلكتروني</text>`;if(m==400)return `<rect width="500" height="500" fill="#34383c"/><g>${[[110,120],[330,125],[230,300],[390,350],[90,365]].map(p=>`<g transform="translate(${p[0]} ${p[1]})"><circle r="35" fill="#a4a9ad" stroke="#e2e5e6" stroke-width="5"/>${Array.from({length:10},(_,i)=>{let a=i*36*Math.PI/180,x=Math.cos(a)*48,y=Math.sin(a)*48;return `<line x1="${Math.cos(a)*32}" y1="${Math.sin(a)*32}" x2="${x}" y2="${y}" stroke="#ddd" stroke-width="4"/><circle cx="${x}" cy="${y}" r="5" fill="#cfd2d3"/>`}).join('')}</g>`).join('')}</g>`;return `<rect width="500" height="500" fill="#17272d"/><g transform="translate(250 250)"><circle r="150" fill="#29464d"/>${Array.from({length:20},(_,i)=>{let a=i*18*Math.PI/180,x=Math.cos(a)*178,y=Math.sin(a)*178;return `<line x1="${Math.cos(a)*142}" y1="${Math.sin(a)*142}" x2="${x}" y2="${y}" stroke="#a8e0db" stroke-width="7"/><circle cx="${x}" cy="${y}" r="10" fill="#d2f1ee"/>`}).join('')}<circle r="137" fill="#518b91" stroke="#8cc7c5" stroke-width="10"/><circle r="100" fill="#28464f" stroke="#b8dcda" stroke-width="7"/><path d="M-65 15 C-35-85 15 85 60-35 C85-80 95 50 40 65 C-10 90-20-45-65 15" fill="none" stroke="#e7d58b" stroke-width="13"/></g>`}function applyOptics(){const f=+focusEl.value,l=+lightEl.value;const d=Math.abs(f-72);const blur=Math.min(8,d/7);const brightness=.18+(l/100)*1.35;const contrast=.72+(l/100)*.48;pic.style.filter=`blur(${blur.toFixed(2)}px) brightness(${brightness.toFixed(2)}) contrast(${contrast.toFixed(2)})`;field.style.boxShadow=`inset 0 0 ${Math.round(90-l*.55)}px rgba(0,0,0,${(0.72-l*.0055).toFixed(2)})`;ft.textContent=d<5?`واضح جدًا ✓ — ${f}%`:d<12?`قريب من الوضوح — ${f}%`:`غير واضح — ${f}%`;lt.textContent=l+'%';if(s&&d<5){stage=4;drawSteps()}}function render(){if(!s)return;let m=+magEl.value;pic.innerHTML=s==='b'?bacteria(m):virus(m);if(s==='b'){legend.innerHTML=m==100?'<span class="tag">خلايا عصوية</span>':m==400?'<span class="tag">الجدار الخلوي</span><span class="tag">السيتوبلازم</span><span class="tag">الريبوسومات</span>':'<span class="tag">محفظة</span><span class="tag">غشاء بلازمي</span><span class="tag">DNA</span><span class="tag">ريبوسومات</span><span class="tag">سوط</span>';obs.textContent=m==100?'تظهر الأشكال العامة للخلايا البكتيرية.':m==400?'بدأت تفاصيل الخلية البكتيرية بالظهور.':'تظهر البنية الداخلية الدقيقة للبكتيريا.'}else{legend.innerHTML=m==100?'<span class="tag">غير مرئي ضوئيًا</span>':m==400?'<span class="tag">محاكاة مجهر إلكتروني</span>':'<span class="tag">غلاف فيروسي</span><span class="tag">بروتينات سطحية</span><span class="tag">قفيصة</span><span class="tag">مادة وراثية</span>';obs.textContent=m==100?'الفيروسات لا تظهر منفردة بالمجهر الضوئي.':m==400?'محاكاة إلكترونية للجسيمات الفيروسية.':'تظهر البنية الدقيقة للفيروس.'}stage=m==100?2:3;drawSteps();applyOptics()}document.querySelector('#power').addEventListener('click',()=>{on=!on;off.style.display=on?'none':'grid';stage=on?1:0;inst.textContent=on?'اختر البكتيريا أو الفيروسات.':'شغّل المجهر أولًا.';drawSteps()});document.querySelectorAll('.sample').forEach(x=>x.addEventListener('click',()=>{if(!on)return inst.textContent='شغّل المجهر أولًا.';s=x.dataset.s;document.querySelectorAll('.sample').forEach(y=>y.classList.toggle('active',y===x));inst.textContent=s==='b'?'غيّر التكبير ثم حرّك التركيز والإضاءة ولاحظ التغيّر المباشر.':'الفيروسات تحتاج محاكاة المجهر الإلكتروني عند التكبير الأعلى.';render()}));magEl.addEventListener('change',render);focusEl.addEventListener('input',applyOptics);lightEl.addEventListener('input',applyOptics);document.querySelectorAll('[data-a]').forEach(x=>x.addEventListener('click',()=>feed.innerHTML=x.dataset.a==='1'?'<span class="good">✓ صحيح، المجهر الإلكتروني.</span>':'<span class="bad">حاولي مرة أخرى.</span>'));document.querySelector('#reset').addEventListener('click',()=>location.reload());applyOptics();</script></body></html>
